<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>E-Okul Mini</title>

<style>
body {
    font-family: Arial;
    margin: 0;
    background: #f2f2f2;
}

/* SPLASH */
#splash-screen {
    position: fixed;
    top:0; left:0;
    width:100%; height:100%;
    background:#111;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:24px;
    transition: opacity 1.2s ease;
    z-index:999;
}

/* PANELS */
#auth-container, #panel, #teacher-panel {
    display:none;
    padding:20px;
}

.box {
    background:white;
    width:300px;
    margin:50px auto;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.2);
}

input, button {
    width:100%;
    padding:10px;
    margin:5px 0;
}

#student-list div {
    background:#eee;
    padding:10px;
    margin:5px 0;
}
</style>
</head>

<body>

<!-- SPLASH -->
<div id="splash-screen">
    Yükleniyor...
</div>

<!-- AUTH -->
<div id="auth-container">

    <div class="box" id="login-box">
        <h2>Giriş</h2>
        <input id="login-id" placeholder="Email / ogretmen">
        <button onclick="girisYap()">Giriş</button>
        <button onclick="toggleUI()">Kayıt Ol</button>
    </div>

    <div class="box" id="register-box" style="display:none;">
        <h2>Kayıt</h2>
        <input id="reg-email" placeholder="Email">
        <input id="reg-name" placeholder="Ad Soyad">
        <input id="reg-class" placeholder="Sınıf">
        <button onclick="kaydet()">Kaydol</button>
        <button onclick="toggleUI()">Geri</button>
    </div>

</div>

<!-- STUDENT -->
<div id="panel">
    <h2>Öğrenci Paneli</h2>
    <div id="student-info"></div>
    <button onclick="cikis()">Çıkış</button>
</div>

<!-- TEACHER -->
<div id="teacher-panel">
    <h2>Öğretmen Paneli</h2>
    <div id="student-list"></div>
    <button onclick="cikis()">Çıkış</button>
</div>

<script>
const curriculum = [
    { name:"Matematik" }, { name:"Türkçe" },
    { name:"Fizik" }, { name:"Kimya" }
];

let currentUser = null;

/* SPLASH FIX */
window.addEventListener("load", () => {
    const splash = document.getElementById("splash-screen");
    const auth = document.getElementById("auth-container");

    setTimeout(() => {
        splash.style.opacity = "0";

        setTimeout(() => {
            splash.style.display = "none";
            auth.style.display = "block";
        }, 1200);

    }, 6000); // 🔥 SPLASH UZUNLUK
});

/* TOGGLE */
function toggleUI(){
    const reg = document.getElementById("register-box");
    const log = document.getElementById("login-box");

    const hidden = getComputedStyle(reg).display === "none";

    if(hidden){
        reg.style.display = "block";
        log.style.display = "none";
    } else {
        reg.style.display = "none";
        log.style.display = "block";
    }
}

/* KAYIT */
function kaydet(){
    let email = document.getElementById("reg-email").value;
    let name = document.getElementById("reg-name").value;
    let cls = document.getElementById("reg-class").value;

    if(!email || !name){
        alert("Boş bırakma!");
        return;
    }

    let students = JSON.parse(localStorage.getItem("students") || "[]");

    if(students.find(s => s.email === email)){
        alert("Zaten kayıtlı!");
        return;
    }

    let newUser = {
        email,
        name,
        class: cls,
        grades: {}
    };

    curriculum.forEach(c=>{
        newUser.grades[c.name] = { s1:0, s2:0 };
    });

    students.push(newUser);
    localStorage.setItem("students", JSON.stringify(students));

    alert("Kayıt başarılı!");
    toggleUI();
}

/* GİRİŞ */
function girisYap(){
    let id = document.getElementById("login-id").value;
    let students = JSON.parse(localStorage.getItem("students") || "[]");

    if(id && id.toLowerCase().trim() === "ogretmen"){
        document.getElementById("auth-container").style.display = "none";
        document.getElementById("teacher-panel").style.display = "block";
        renderList();
        return;
    }

    let found = students.find(s => s.email === id);

    if(found){
        currentUser = found;
        document.getElementById("auth-container").style.display = "none";
        document.getElementById("panel").style.display = "block";

        document.getElementById("student-info").innerHTML = `
            <h3>${found.name}</h3>
            <p>${found.class}</p>
        `;
    } else {
        alert("Kullanıcı yok!");
    }
}

/* ÖĞRETMEN LİSTE */
function renderList(){
    let students = JSON.parse(localStorage.getItem("students") || "[]");
    let div = document.getElementById("student-list");

    div.innerHTML = "";

    students.forEach(s=>{
        div.innerHTML += `
            <div>
                <b>${s.name}</b><br>
                ${s.email}<br>
                ${s.class}
            </div>
        `;
    });
}

/* ÇIKIŞ */
function cikis(){
    location.reload();
}
</script>

</body>
</html>
