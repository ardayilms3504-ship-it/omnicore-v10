<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMNICORE V10 | AI</title>
    <style>
        /* Modern Değişkenler */
        :root {
            --bg: #000000;
            --card-bg: #0a0a0a;
            --accent: #ffffff;
            --border: #1a1a1a;
            --text-secondary: #a0a0a0;
            --gradient: linear-gradient(135deg, #1a1a1a 0%, #000000 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--accent);
            height: 100vh;
            overflow: hidden;
        }

        /* --- SIRA DIŞI SPLASH EKRANI --- */
        #splash {
            position: fixed;
            inset: 0;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: all 1s cubic-bezier(0.19, 1, 0.22, 1);
        }

        .splash-content {
            text-align: center;
        }

        .loader-ring {
            width: 60px;
            height: 60px;
            border: 2px solid transparent;
            border-top: 2px solid var(--accent);
            border-radius: 50%;
            animation: spin 1s cubic-bezier(0.5, 0.1, 0.5, 0.9) infinite;
            margin-bottom: 20px;
        }

        .brand-name {
            font-size: 1.5rem;
            font-weight: 200;
            letter-spacing: 0.8rem;
            text-transform: uppercase;
            opacity: 0;
            transform: translateY(10px);
            animation: slideUp 0.8s ease forwards 0.3s;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }

        /* --- ANA UYGULAMA ARAYÜZÜ --- */
        #main-app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            opacity: 0;
            filter: blur(10px);
            transition: all 1.2s ease-in-out;
        }

        #main-app.active {
            opacity: 1;
            filter: blur(0);
        }

        header {
            padding: 20px 40px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(10px);
            background: rgba(0,0,0,0.5);
        }

        .status {
            font-size: 0.7rem;
            color: #00ff88;
            text-transform: uppercase;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .dot { width: 6px; height: 6px; background: #00ff88; border-radius: 50%; box-shadow: 0 0 10px #00ff88; }

        /* Mesaj Alanı */
        #chat-window {
            flex: 1;
            overflow-y: auto;
            padding: 40px;
            display: flex;
            flex-direction: column;
            gap: 30px;
            scroll-behavior: smooth;
        }

        .msg {
            max-width: 700px;
            padding: 15px 20px;
            border-radius: 15px;
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .user-msg {
            align-self: flex-end;
            background: var(--accent);
            color: #000;
            font-weight: 500;
        }

        .ai-msg {
            align-self: flex-start;
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text-secondary);
        }

        /* Klavye / Giriş Alanı */
        .input-section {
            padding: 40px;
            display: flex;
            justify-content: center;
        }

        .input-container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 12px 20px;
            display: flex;
            align-items: flex-end;
            gap: 15px;
            transition: border 0.3s;
        }

        .input-container:focus-within {
            border-color: #444;
        }

        textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 1rem;
            padding: 10px 0;
            outline: none;
            resize: none;
            max-height: 200px;
            min-height: 24px;
        }

        #send-btn {
            background: #fff;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.2s, background 0.2s;
        }

        #send-btn:hover { transform: scale(1.05); }
        #send-btn:active { transform: scale(0.95); }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #222; border-radius: 10px; }
    </style>
</head>
<body>

    <!-- Splash Ekrani -->
    <div id="splash">
        <div class="splash-content">
            <div class="loader-ring"></div>
            <div class="brand-name">OMNICORE</div>
        </div>
    </div>

    <!-- Ana Uygulama -->
    <div id="main-app">
        <header>
            <div class="brand-small">OMNICORE V10</div>
            <div class="status"><span class="dot"></span> Grok-1 Online</div>
        </header>

        <div id="chat-window">
            <div class="msg ai-msg">Sisteme hoş geldin. Senin için ne yapabilirim?</div>
        </div>

        <div class="input-section">
            <div class="input-container">
                <textarea id="prompt" placeholder="Yapay zekaya bir mesaj gönder..." rows="1"></textarea>
                <button id="send-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        // 1. Splash Kontrolü
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash');
                const app = document.getElementById('main-app');
                
                splash.style.opacity = '0';
                splash.style.transform = 'scale(1.1)';
                
                setTimeout(() => {
                    splash.style.display = 'none';
                    app.classList.add('active');
                }, 800);
            }, 2500);
        });

        // 2. Otomatik Uzayan Klavye Alanı
        const textarea = document.getElementById('prompt');
        textarea.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });

        // 3. Grok API İşlemleri
        const API_KEY = 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; // Kendi key'ini buraya koy
        const chatWindow = document.getElementById('chat-window');
        const sendBtn = document.getElementById('send-btn');

        async function sendMessage() {
            const text = textarea.value.trim();
            if (!text) return;

            // Kullanıcı mesajını ekrana yaz
            appendMessage(text, 'user-msg');
            textarea.value = '';
            textarea.style.height = 'auto';

            try {
                const response = await fetch("https://api.x.ai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${API_KEY}`
                    },
                    body: JSON.stringify({
                        messages: [{ role: "user", content: text }],
                        model: "grok-1",
                        stream: false
                    })
                });

                const data = await response.json();
                const aiResponse = data.choices[0].message.content;
                
                appendMessage(aiResponse, 'ai-msg');
            } catch (error) {
                appendMessage("Hata: API bağlantısı kurulamadı. Lütfen anahtarını kontrol et.", 'ai-msg');
            }
        }

        function appendMessage(text, className) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `msg ${className}`;
            msgDiv.innerText = text;
            chatWindow.appendChild(msgDiv);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        sendBtn.addEventListener('click', sendMessage);

        // Enter ile gönderme (Shift+Enter alt satıra geçer)
        textarea.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
    </script>
</body>
                      </html>
