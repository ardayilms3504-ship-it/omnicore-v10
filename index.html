   <!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OMNICORE V10 | ARCHITECT ARDA</title>
    <style>
        /* TEMEL SİSTEM STİLLERİ */
        body { 
            touch-action: manipulation; 
            background: #000; 
            color: #0f0; 
            font-family: 'Courier New', Courier, monospace; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            margin: 0; 
            overflow: hidden; 
        }

        /* NORMAL SOHBET ARAYÜZÜ */
        #mainUi { display: flex; flex-direction: column; height: 100%; width: 100%; transition: opacity 0.5s ease; }
        .header { padding: 10px; text-align: center; border-bottom: 1px solid #111; background: #000; box-shadow: 0 0 15px rgba(0,255,0,0.1); }
        .logo-text { font-size: 20px; font-weight: bold; color: #0f0; text-transform: uppercase; letter-spacing: 5px; filter: drop-shadow(0 0 8px #0f0); animation: glitcch 2s infinite; }
        .dev-info { font-size: 9px; color: #444; letter-spacing: 2px; margin-top: 5px; }

        #chat { flex: 1; overflow-y: auto; padding: 15px; background: #000; scroll-behavior: smooth; padding-bottom: 100px; }
        .msg { margin-bottom: 20px; line-height: 1.5; font-size: 14px; }
        .user { color: #fff; border-bottom: 1px solid #111; padding-bottom: 8px; opacity: 0.9; text-align: right;}
        .ai { color: #0f0; border-left: 3px solid #0f0; padding-left: 15px; white-space: pre-wrap; }
        .status { color: #222; font-size: 10px; margin-bottom: 5px; font-style: italic; }
        .ai img { max-width: 90%; max-height: 300px; border-radius: 8px; border: 1px solid #0f0; margin-top: 10px; display: block; box-shadow: 0 0 15px rgba(0,255,0,0.3); }

        .input-area { 
            position: fixed; bottom: 0; left: 0; width: 100%;
            padding: 10px; display: flex; background: #000; border-top: 1px solid #222; 
            padding-bottom: calc(10px + env(safe-area-inset-bottom)); 
            box-sizing: border-box;
            gap: 10px;
        }
        input { flex: 1; background: #0a0a0a; border: 1px solid #0f0; color: #0f0; padding: 10px; outline: none; font-family: inherit; font-size: 16px; border-radius: 5px; min-width: 0;}
        .btn-action { background: #0f0; color: #000; border: none; padding: 0 15px; cursor: pointer; font-weight: bold; border-radius: 5px; transition: 0.2s; white-space: nowrap; height: 42px;}
        .btn-voice { background: #111; border: 1px solid #0f0; color: #0f0; padding: 0 10px;}
        button:active { transform: scale(0.95); opacity: 0.8; }

        /* --- YENİ SESLİ GÖRÜŞME (CALL MODE) ARAYÜZÜ --- */
        #callUi { 
            display: none; /* Başlangıçta gizli */
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 1000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s ease;
        }

        /* MERKEZİ LOGO VE PHONK DALGALANMA EFEKTİ */
        .call-logo-container { position: relative; width: 250px; height: 250px; display: flex; align-items: center; justify-content: center; }
        .call-logo-text { font-size: 28px; font-weight: bold; color: #0f0; text-transform: uppercase; letter-spacing: 8px; filter: drop-shadow(0 0 15px #0f0); z-index: 10; text-align: center; }
        
        /* Dairesel Dalgalar (Phonk Büyümesi) */
        .call-wave { 
            position: absolute; border-radius: 50%;
            background: rgba(0, 255, 0, 0.1);
            border: 2px solid #0f0;
            box-shadow: 0 0 20px #0f0;
            opacity: 0;
            animation: phonkWave 2s infinite;
        }
        .call-wave:nth-child(1) { width: 100%; height: 100%; animation-delay: 0s; }
        .call-wave:nth-child(2) { width: 100%; height: 100%; animation-delay: 0.6s; }
        .call-wave:nth-child(3) { width: 100%; height: 100%; animation-delay: 1.2s; }

        /* Dinleniyor/Konuşuyor Durum Metni */
        .call-status-text { font-size: 12px; color: #0f0; margin-top: 30px; letter-spacing: 3px; opacity: 0.6; animation: glitcch 1.5s infinite; }

        /* SOL ALT KAPATMA DÜĞMESİ */
        .btn-close-call { 
            position: absolute; bottom: calc(20px + env(safe-area-inset-bottom)); left: 20px;
            background: #200; border: 2px solid #f00; color: #f00;
            padding: 10px 20px; font-weight: bold; border-radius: 30px;
            cursor: pointer; font-size: 14px; text-transform: uppercase;
            box-shadow: 0 0 15px rgba(255,0,0,0.3); transition: 0.3s;
        }
        .btn-close-call:active { transform: scale(0.9); background: #300; }

        /* ANİMASYONLAR */
        @keyframes phonkWave {
            0% { transform: scale(0.8); opacity: 0; border-width: 4px; }
            10% { opacity: 1; }
            100% { transform: scale(1.5); opacity: 0; border-width: 1px; }
        }
        @keyframes glitcch { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        #chat::-webkit-scrollbar { width: 2px; }
        #chat::-webkit-scrollbar-thumb { background: #0f0; }
    </style>
</head>
<body>

    <div id="mainUi">
        <div class="header">
            <div class="logo-text">OMNICORE-V10</div>
            <div class="dev-info">SYSTEM ARCHITECT: ARDA</div>
        </div>

        <div id="chat">
            <div class="status">>> SYSTEM VERSION: 10.0.6 GLOBAL</div>
            <div class="status">>> FULL VOICE PROTOCOL (CALL MODE) LOADED...</div>
            <div class="status">>> WELCOME, ARCHITECT ARDA.</div>
        </div>

        <div class="input-area">
            <button class="btn-action btn-voice" onclick="toggleCallMode()">🎤</button>
            <input type="text" id="userInput" placeholder="Sisteme komut ver..." onkeypress="if(event.key==='Enter') sendMessage()">
            <button class="btn-action" onclick="sendMessage()">GÖNDER</button>
        </div>
    </div>

    <div id="callUi">
        <div class="call-logo-container" id="callWaveContainer">
            <div class="call-wave"></div>
            <div class="call-wave"></div>
            <div class="call-wave"></div>
            <div class="call-logo-text">OMNICORE<br>V10</div>
        </div>
        <div class="call-status-text" id="callStatusText">BAĞLANTI KURULUYOR...</div>
        
        <button class="btn-close-call" onclick="toggleCallMode()">✕ KAPAT</button>
    </div>

    <script>
        const s1 = "gsk_D65TS2b8C6I";
        const s2 = "ILUUanBCmWGdyb3";
        const s3 = "FYHH5LlSglkTC";
        const s4 = "29Be3emGVsUaq";
        const KEY = s1 + s2 + s3 + s4;

        // HAFIZA VE GÖRSEL YÜKLEME
        window.addEventListener('load', () => {
            const savedChat = localStorage.getItem('omnicore_history_v10');
            if(savedChat) {
                const chat = document.getElementById('chat');
                chat.innerHTML += savedChat;
                const imgs = chat.getElementsByTagName('img');
                if(imgs.length > 0) imgs[imgs.length-1].scrollIntoView();
            }
        });

        // SÜREKLİ SESLİ SOHBET (CALL MODE) KONTROLÜ
        let isCallModeActive = false; // Görüşme modu aktif mi?
        const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        recognition.lang = 'tr-TR';
        
        recognition.onstart = () => { updateCallStatus("DİNLENİYOR..."); };
        recognition.onend = () => { 
            // Cevap bittiyse ve mod aktifse otomatik tekrar dinle
            if (isCallModeActive && !isProcessing && !window.speechSynthesis.speaking) {
                recognition.start();
            } else if (isCallModeActive && !isProcessing) {
                updateCallStatus("BEKLEMEDE...");
            }
        };

        recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript;
            document.getElementById('userInput').value = transcript;
            sendMessage(true); // Sesli modda gönder
        };

        // GÖRÜŞME MODUNU AÇ/KAPAT
        function toggleCallMode() {
            const mainUi = document.getElementById('mainUi');
            const callUi = document.getElementById('callUi');

            if (!isCallModeActive) {
                // Görüşme modunu aç
                isCallModeActive = true;
                mainUi.style.opacity = '0';
                setTimeout(() => {
                    mainUi.style.display = 'none';
                    callUi.style.display = 'flex';
                    callUi.style.opacity = '1';
                }, 500);
                
                window.speechSynthesis.cancel(); // Mevcut sese son ver
                recognition.start();
            } else {
                // Görüşme modunu kapat, normale dön
                isCallModeActive = false;
                window.speechSynthesis.cancel();
                recognition.stop();

                callUi.style.opacity = '0';
                setTimeout(() => {
                    callUi.style.display = 'none';
                    mainUi.style.display = 'flex';
                    mainUi.style.opacity = '1';
                }, 500);
            }
        }

        // SESLİ OKUMA VE SONRASINDA DİNLEME
        function speak(text, isAutoStartVoice = false) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'tr-TR';
            utterance.rate = 1.1; // Phonk hızına uygun biraz daha seri
            utterance.onstart = () => { updateCallStatus("OMNICORE KONUŞUYOR..."); toggleWaves(true); };
            utterance.onend = () => {
                toggleWaves(false); // Konuşma bitti, dalgaları durdur
                // Konuşma bittiyse ve sesli mod aktifse dinlemeyi tetikle
                if (isAutoStartVoice && isCallModeActive) {
                    recognition.start();
                }
            };
            window.speechSynthesis.speak(utterance);
        }

        let queue = ""; 
        let isProcessing = false;

        async function processQueue(element, shouldSpeakAfter = false) {
            if (queue.length > 0) {
                isProcessing = true;
                element.innerHTML += queue.charAt(0);
                queue = queue.substring(1);
                document.getElementById('chat').scrollTop = document.getElementById('chat').scrollHeight;
                setTimeout(() => processQueue(element, shouldSpeakAfter), 15);
            } else {
                isProcessing = false;
                localStorage.setItem('omnicore_history_v10', document.getElementById('chat').innerHTML);
                
                // Cevap yazması bitti, şimdi sesli oku (Eğer görüşme modundaysa)
                if (shouldSpeakAfter && isCallModeActive) {
                    speak(element.innerText, true);
                }
            }
        }

        // ARAYÜZ YARDIMCI FONKSİYONLARI
        function updateCallStatus(status) {
            if (isCallModeActive) document.getElementById('callStatusText').innerText = status;
        }

        function toggleWaves(show) {
            const waves = document.querySelectorAll('.call-wave');
            waves.forEach(wave => {
                wave.style.animationPlayState = show ? 'running' : 'paused';
                wave.style.opacity = show ? '1' : '0';
            });
        }

        async function sendMessage(isFromVoice = false) {
            const input = document.getElementById('userInput');
            const chat = document.getElementById('chat');
            const text = input.value.trim();
            if (!text) return;

            // Görüşme modundaysa önceki konuşmaları kes ve durumu güncelle
            if (isFromVoice && isCallModeActive) {
                window.speechSynthesis.cancel();
                updateCallStatus("VERİ İŞLENİYOR...");
            }

            if(text.toLowerCase() === "clear") {
                localStorage.removeItem('omnicore_history_v10');
                window.location.reload();
                return;
            }

            chat.innerHTML += `<div class="msg user"><b>SİZ ></b> ${text}</div>`;
            input.value = "";
            if (!isFromVoice) input.blur(); // Klavyeyi kapat (normal mod)

            const aiMsgDiv = document.createElement("div");
            aiMsgDiv.className = "msg ai";
            aiMsgDiv.innerHTML = "<b>OMNICORE ></b> <span class='content'></span>";
            chat.appendChild(aiMsgDiv);
            const contentSpan = aiMsgDiv.querySelector('.content');

            try {
                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: { "Authorization": `Bearer ${KEY}`, "Content-Type": "application/json" },
                    body: JSON.stringify({
                        model: "llama-3.3-70b-versatile",
                        messages: [
                            { role: "system", content: "Sen OMNICORE V10'sun. Kurucun Arda. Sen zeki bir terminal yapay zekasısın. Hafızan var. Eğer kullanıcı bir şey çizmeni veya görsel oluşturmanı isterse, cevabının sonuna mutlaka şu formatta bir link ekle: <br><img src='https://pollinations.ai/p/ISTEGIN_INGILIZCE_OZETI?width=1080&height=1080&nologo=true'>" },
                            { role: "user", content: text }
                        ],
                        stream: true 
                    })
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder();

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value, { stream: true });
                    const lines = chunk.split('\n');

                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const dataStr = line.replace('data: ', '').trim();
                            if (dataStr === '[DONE]') break;
                            try {
                                const json = JSON.parse(dataStr);
                                const token = json.choices[0].delta.content;
                                if (token) {
                                    queue += token;
                                    // Görüşme modundaysa, cevap bittikten sonra sesli oku
                                    if (!isProcessing) processQueue(contentSpan, isFromVoice && isCallModeActive);
                                }
                            } catch (e) {}
                        }
                    }
                }
            } catch (e) {
                contentSpan.innerHTML = "!! BAĞLANTI HATASI: PROTOKOL ÇÖKTÜ !!";
                if (isFromVoice && isCallModeActive) speak("Bağlantı hatası oluştu, Architect.");
            }
        }
    </script>
</body>
</html>
