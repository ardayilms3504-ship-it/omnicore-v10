<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AAL E-Okul | Apocreator24</title>
    <style>
        body, html { margin: 0; padding: 0; background-color: #000; color: #fff; font-family: 'Segoe UI', sans-serif; height: 100%; width: 100%; overflow: hidden; }
        
        /* Neon Splash */
        #splash-screen { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; display: flex; justify-content: center; align-items: center; z-index: 9999; transition: opacity 1s; }
        .aal-logo { font-size: 60px; font-weight: 900; color: #fff; border: 4px solid #fff; padding: 10px 30px; border-radius: 20px; text-shadow: 0 0 15px #007bff; box-shadow: 0 0 20px #007bff; animation: flicker 3s infinite; }
        @keyframes flicker { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }

        .container { background: #111; padding: 25px; border-radius: 20px; border: 1px solid #222; width: 90%; max-width: 400px; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); display: none; }
        h2 { text-align: center; color: #007bff; margin-bottom: 20px; }
        input, select { width: 100%; padding: 12px; margin: 8px 0; background: #1a1a1a; border: 1px solid #333; color: #fff; border-radius: 10px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #007bff; border: none; color: white; font-weight: bold; border-radius: 10px; cursor: pointer; margin-top: 10px; }
        
        /* Panel Tasarımları */
        #main-panel, #teacher-panel { width: 95%; max-width: 600px; height: 80vh; overflow-y: auto; }
        .student-card { background: #1a1a1a; padding: 15px; margin: 10px 0; border-radius: 12px; border: 1px solid #333; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .student-card:hover { border-color: #007bff; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #333; padding: 10px; text-align: center; font-size: 14px; }
        th { background: #007bff; }
        .readonly-input { background: transparent; border: none; color: #007bff; text-align: center; width: 40px; font-weight: bold; }

        .dev-footer { position: fixed; bottom: 10px; width: 100%; text-align: center; color: #444; font-size: 10px; letter-spacing: 1px; }
        .dev-footer span { color: #007bff; }
    </style>
</head>
<body>

    <div id="splash-screen"><div class="aal-logo">AAL</div></div>

    <div id="auth-panel" class="container">
        <h2 id="auth-title">Sisteme Kayıt</h2>
        <input type="text" id="name" placeholder="Ad Soyad">
        <input type="email" id="email" placeholder="E-posta">
        <select id="role">
            <option value="student">Öğrenci</option>
            <option value="teacher">Öğretmen</option>
        </select>
        <button onclick="handleAuth()">Devam Et</button>
        <p style="text-align:center; font-size:12px; color:#555; margin-top:15px;">Kayıt verileri cihazınıza kaydedilir.</p>
    </div>

    <div id="teacher-panel" class="container">
        <h2>Öğretmen Paneli</h2>
        <p style="font-size:12px; color:#aaa;">Öğrenci seçerek notlarını güncelleyebilirsiniz:</p>
        <div id="student-list"></div>
        <button onclick="location.reload()" style="background:#333;">Çıkış Yap</button>
    </div>

    <div id="main-panel" class="container">
        <h2 id="user-welcome">Hoş Geldin</h2>
        <table>
            <thead><tr><th>Ders</th><th>1. Sınav</th><th>2. Sınav</th></tr></thead>
            <tbody id="grade-table"></tbody>
        </table>
        <div id="result-area" style="margin-top:20px; text-align:center; font-weight:bold; color:#007bff;"></div>
        <button onclick="location.reload()" style="background:#333; margin-top:20px;">Çıkış Yap</button>
    </div>

    <div class="dev-footer">DEVELOPED BY <span>APOCREATOR24</span></div>

    <script>
        let currentUser = null;
        const lessons = ["Matematik", "Fizik", "Edebiyat", "Kimya", "Biyoloji"];

        // Splash ekranı
        setTimeout(() => {
            document.getElementById('splash-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('splash-screen').style.display = 'none';
                document.getElementById('auth-panel').style.display = 'block';
            }, 1000);
        }, 2500);

        function handleAuth() {
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const role = document.getElementById('role').value;

            if(!name || !email) return alert("Lütfen alanları doldurun.");

            currentUser = { name, email, role, grades: {} };
            lessons.forEach(l => currentUser.grades[l] = { s1: 0, s2: 0 });

            if(role === 'student') {
                let students = JSON.parse(localStorage.getItem('students') || '[]');
                if(!students.find(s => s.email === email)) {
                    students.push(currentUser);
                    localStorage.setItem('students', JSON.stringify(students));
                } else {
                    currentUser = students.find(s => s.email === email);
                }
                showStudentPanel();
            } else {
                showTeacherPanel();
            }
        }

        function showStudentPanel() {
            document.getElementById('auth-panel').style.display = 'none';
            document.getElementById('main-panel').style.display = 'block';
            document.getElementById('user-welcome').innerText = "Merhaba, " + currentUser.name;
            
            const tbody = document.getElementById('grade-table');
            tbody.innerHTML = "";
            lessons.forEach(l => {
                tbody.innerHTML += `<tr><td>${l}</td><td>${currentUser.grades[l].s1}</td><td>${currentUser.grades[l].s2}</td></tr>`;
            });
            calculateResult();
        }

        function showTeacherPanel() {
            document.getElementById('auth-panel').style.display = 'none';
            document.getElementById('teacher-panel').style.display = 'block';
            renderStudentList();
        }

        function renderStudentList() {
            const list = document.getElementById('student-list');
            const students = JSON.parse(localStorage.getItem('students') || '[]');
            list.innerHTML = students.length ? "" : "<p>Henüz kayıtlı öğrenci yok.</p>";
            
            students.forEach((s, index) => {
                list.innerHTML += `
                    <div class="student-card" onclick="editStudent(${index})">
                        <span>${s.name} (${s.email})</span>
                        <span style="color:#007bff;">Not Ver ></span>
                    </div>`;
            });
        }

        function editStudent(index) {
            let students = JSON.parse(localStorage.getItem('students'));
            let s = students[index];
            
            let newGrades = prompt(`${s.name} için Matematik 1. Sınav notunu girin:`, s.grades["Matematik"].s1);
            if(newGrades !== null) {
                s.grades["Matematik"].s1 = parseInt(newGrades);
                students[index] = s;
                localStorage.setItem('students', JSON.stringify(students));
                alert("Not güncellendi!");
                renderStudentList();
            }
        }

        function calculateResult() {
            let total = 0;
            lessons.forEach(l => {
                total += (currentUser.grades[l].s1 + currentUser.grades[l].s2) / 2;
            });
            let avg = total / lessons.length;
            let status = avg >= 85 ? "Takdir Belgesi" : (avg >= 70 ? "Teşekkür Belgesi" : "Geçti");
            document.getElementById('result-area').innerText = `Ortalama: ${avg.toFixed(2)} - Durum: ${status}`;
        }
    </script>
</body>
</html>
