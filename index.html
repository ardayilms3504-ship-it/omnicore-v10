<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OMNICORE V10 | ARCHITECT ARDA</title>
    <style>
        body { touch-action: manipulation; background: #000; color: #0f0; font-family: 'Courier New', monospace; display: flex; flex-direction: column; height: 100vh; margin: 0; overflow: hidden; }
        
        /* ANA PANEL */
        #mainUi { display: flex; flex-direction: column; height: 100%; transition: 0.5s; }
        .header { padding: 10px; text-align: center; border-bottom: 1px solid #111; }
        .logo-text { font-size: 20px; font-weight: bold; color: #0f0; letter-spacing: 5px; filter: drop-shadow(0 0 8px #0f0); }
        #chat { flex: 1; overflow-y: auto; padding: 15px; padding-bottom: 100px; }
        .msg { margin-bottom: 20px; font-size: 14px; }
        .user { color: #fff; text-align: right; border-bottom: 1px solid #111; padding-bottom: 5px; }
        .ai { color: #0f0; border-left: 3px solid #0f0; padding-left: 10px; }
        .ai img { max-width: 100%; border-radius: 8px; border: 1px solid #0f0; margin-top: 10px; box-shadow: 0 0 15px rgba(0,255,0,0.3); }

        /* GÖRÜŞME EKRANI (CALL UI) */
        #callUi { display: none; position: fixed; inset: 0; background: #000; z-index: 1000; flex-direction: column; align-items: center; justify-content: center; }
        .call-logo { font-size: 30px; font-weight: bold; color: #0f0; z-index: 10; text-align: center; letter-spacing: 5px; }
        
        /* PHONK DALGALANMA EFEKTİ */
        .wave { position: absolute; border-radius: 50%; border: 2px solid #0f0; opacity: 0; animation: phonk 2s infinite; }
        @keyframes phonk { 0% { transform: scale(0.5); opacity: 0; } 50% { opacity: 1; } 100% { transform: scale(1.8); opacity: 0; } }

        /* KAPATMA DÜĞMESİ (SOL ALT) */
        .btn-exit { position: absolute; bottom: 30px; left: 20px; background: #300; border: 2px solid #f00; color: #f00; padding: 10px 20px; border-radius: 20px; font-weight: bold; }

        .input-area { position: fixed; bottom: 0; width: 100%; display: flex; padding: 10px; background: #000; border-top: 1px solid #222; box-sizing: border-box; gap: 10px; }
        input { flex: 1; background: #0a0a0a; border: 1px solid #0f0; color: #0f0; padding: 12px; border-radius: 5px; outline: none; }
        .btn { background: #0f0; color: #000; border: none; padding: 0 15px; font-weight: bold; border-radius: 5px; }
    </style>
</head>
<body>

    <div id="mainUi">
        <div class="header"><div class="logo-text">OMNICORE-V10</div></div>
        <div id="chat"></div>
        <div class="input-area">
            <button class="btn" style="background:#111; color:#0f0; border:1px solid #0f0;" onclick="startCallMode()">🎤</button>
            <input type="text" id="userInput" placeholder="Mesaj yaz..." onkeypress="if(event.key==='Enter') send()">
            <button class="btn" onclick="send()">GÖNDER</button>
        </div>
    </div>

    <div id="callUi">
        <div class="wave" style="width:200px; height:200px; animation-delay:0s;"></div>
        <div class="wave" style="width:200px; height:200px; animation-delay:0.5s;"></div>
        <div class="call-logo">OMNICORE<br>V10</div>
        <div id="callStatus" style="margin-top:40px; color:#0f0; opacity:0.6;">DİNLENİYOR...</div>
        <button class="btn-exit" onclick="stopCallMode()">✕ KAPAT</button>
    </div>

    <script>
        const KEY = "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";
        let isCalling = false;
        const recog = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        recog.lang = 'tr-TR';
        recog.continuous = false;

        // SESLİ YANIT FONKSİYONU (Robotun Konuşması)
        function speak(text) {
            const synth = window.speechSynthesis;
            const utter = new SpeechSynthesisUtterance(text);
            utter.lang = 'tr-TR';
            utter.rate = 1.0; 
            utter.onend = () => { if(isCalling) recog.start(); }; // Konuşma bitince tekrar dinle
            synth.speak(utter);
        }

        recog.onresult = (e) => {
            const msg = e.results[0][0].transcript;
            document.getElementById('userInput').value = msg;
            send(true);
        };

        function startCallMode() {
            isCalling = true;
            document.getElementById('mainUi').style.display = 'none';
            document.getElementById('callUi').style.display = 'flex';
            recog.start();
        }

        function stopCallMode() {
            isCalling = false;
            window.speechSynthesis.cancel();
            recog.stop();
            document.getElementById('callUi').style.display = 'none';
            document.getElementById('mainUi').style.display = 'flex';
        }

        async function send(isVoice = false) {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if(!text) return;

            const chat = document.getElementById('chat');
            chat.innerHTML += `<div class="msg user">SİZ: ${text}</div>`;
            input.value = "";

            const aiDiv = document.createElement("div");
            aiDiv.className = "msg ai";
            aiDiv.innerHTML = "OMNICORE: İşleniyor...";
            chat.appendChild(aiDiv);

            try {
                const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: { "Authorization": `Bearer ${KEY}`, "Content-Type": "application/json" },
                    body: JSON.stringify({
                        model: "llama-3.3-70b-versatile",
                        messages: [{ role: "system", content: "Sen OMNICORE'sun. Görsel istenirse SADECE <img> etiketi ver. Metin istenirse kısa cevap ver." }, { role: "user", content: text }],
                        stream: false
                    })
                });

                const data = await res.json();
                const reply = data.choices[0].message.content;
                aiDiv.innerHTML = "OMNICORE: " + reply;
                chat.scrollTop = chat.scrollHeight;

                // Eğer sesli moddaysa veya mikrofona basıldıysa yanıtı sesli oku
                if(isCalling || isVoice) {
                    // HTML etiketlerini sesli okumasın diye temizle
                    const cleanText = reply.replace(/<[^>]*>/g, '').replace('OMNICORE:', '');
                    speak(cleanText);
                }

            } catch (e) { aiDiv.innerHTML = "Hata."; }
        }
    </script>
</body>
</html>
