<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Block Blast Projesi</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f0f12;
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            touch-action: manipulation;
        }

        /* --- SPLASH / GİRİŞ EKRANI --- */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #0f0f12;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        /* Saf CSS ile Yapılmış Geometrik Blok Logosu */
        .logo-container {
            display: grid;
            grid-template-columns: repeat(2, 40px);
            gap: 6px;
            margin-bottom: 20px;
            animation: pulse 2s infinite ease-in-out;
        }

        .logo-block {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        /* Logodaki blokların canlı neon renkleri */
        .lb-1 { background: #ff3366; }
        .lb-2 { background: #00ccff; }
        .lb-3 { background: #ffcc00; }
        .lb-4 { background: #4caf50; }

        .game-title {
            font-size: 32px;
            font-weight: 900;
            letter-spacing: 2px;
            margin: 10px 0;
            background: linear-gradient(45deg, #00ccff, #ff3366);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        .game-subtitle {
            color: #6a6a75;
            font-size: 14px;
            margin-bottom: 40px;
        }

        /* Yüklenme Çubuğu */
        .loader-bar {
            width: 200px;
            height: 6px;
            background-color: #22222a;
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .loader-progress {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #00ccff, #4caf50);
            border-radius: 3px;
            /* Yüklenme süresi tam 4 saniye (4s) yapıldı */
            animation: loadGame 4s forwards ease-in-out;
        }

        /* Oyuna Başla Butonu */
        .play-btn {
            background: linear-gradient(135deg, #4caf50, #2e7d32);
            color: white;
            border: none;
            padding: 14px 40px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.4);
            opacity: 0;
            visibility: hidden;
            transform: scale(0.9);
            transition: all 0.3s ease;
        }

        .play-btn.show {
            opacity: 1;
            visibility: visible;
            transform: scale(1);
        }

        .play-btn:active {
            transform: scale(0.95);
        }

        /* --- OYUN ALANI TASARIMI --- */
        #game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        #game-container.show {
            opacity: 1;
        }

        #ui-container {
            text-align: center;
            margin-bottom: 15px;
        }

        #score-board {
            font-size: 22px;
            font-weight: bold;
            background: #1e1e24;
            padding: 8px 25px;
            border-radius: 20px;
            border: 1px solid #2e2e36;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
        }

        #game-board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            gap: 5px;
            width: 90vw;
            max-width: 360px;
            height: 90vw;
            max-height: 360px;
            background-color: #16161a;
            padding: 10px;
            border-radius: 16px;
            border: 2px solid #23232a;
            box-shadow: 0 12px 24px rgba(0,0,0,0.6);
        }

        .cell {
            background-color: #24242b;
            border-radius: 6px;
            transition: background-color 0.2s, transform 0.1s;
        }

        .cell.filled {
            background-color: #00ccff;
            box-shadow: inset 0 0 10px rgba(255,255,255,0.4);
        }

        #info-text {
            margin-top: 20px;
            font-size: 13px;
            color: #6a6a75;
            text-align: center;
            max-width: 300px;
            line-height: 1.5;
        }

        /* Animasyonlar */
        @keyframes loadGame {
            to { width: 100%; }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
    </style>
</head>
<body>

    <!-- GİRİŞ (SPLASH) EKRANI VE SAF CSS LOGO -->
    <div id="splash-screen">
        <div class="logo-container">
            <div class="logo-block lb-1"></div>
            <div class="logo-block lb-2"></div>
            <div class="logo-block lb-3"></div>
            <div class="logo-block lb-4"></div>
        </div>
        <div class="game-title">Block Blast</div>
        <div class="game-subtitle">Minimal Puzzle Edition</div>

        <!-- Yüklenme Çubuğu -->
        <div class="loader-bar">
            <div class="loader-progress" id="progress"></div>
        </div>

        <!-- Giriş Butonu -->
        <button class="play-btn" id="start-btn">OYUNA BAŞLA</button>
    </div>

    <!-- GERÇEK OYUN ALANI -->
    <div id="game-container">
        <div id="ui-container">
            <div id="score-board">Puan: <span id="score">0</span></div>
        </div>

        <div id="game-board"></div>

        <p id="info-text">Karelere dokunarak matrisi doldur. Sıraları tamamlayarak blokları patlat ve en yüksek skora ulaş!</p>
    </div>

    <script>
        // Giriş Ekranı Kontrolleri
        const progress = document.getElementById('progress');
        const startBtn = document.getElementById('start-btn');
        const splashScreen = document.getElementById('splash-screen');
        const gameContainer = document.getElementById('game-container');

        // Zamanlayıcı tam 4000 milisaniye (4 saniye) olarak güncellendi
        setTimeout(() => {
            startBtn.classList.add('show');
        }, 4000); 

        // Butona basıldığında oyuna geçiş yap
        startBtn.addEventListener('click', () => {
            splashScreen.style.opacity = '0';
            splashScreen.style.visibility = 'hidden';
            gameContainer.classList.add('show');
        });

        // OYUN MANTIĞI ALTYAPISI
        const board = document.getElementById('game-board');
        const scoreDisplay = document.getElementById('score');
        let score = 0;
        
        const gridData = Array(8).fill(null).map(() => Array(8).fill(0));
        const cellElements = [];

        // 8x8 Tahtayı Oluşturma
        for (let r = 0; r < 8; r++) {
            for (let c = 0; c < 8; c++) {
                const cell = document.createElement('div');
                cell.classList.add('cell');
                cell.addEventListener('click', () => toggleCell(r, c));
                board.appendChild(cell);
                cellElements.push(cell);
            }
        }

        function toggleCell(row, col) {
            const index = row * 8 + col;
            if (gridData[row][col] === 0) {
                gridData[row][col] = 1;
                cellElements[index].classList.add('filled');
            } else {
                gridData[row][col] = 0;
                cellElements[index].classList.remove('filled');
            }
            checkLines();
        }

        function checkLines() {
            let linesCleared = 0;
            for (let r = 0; r < 8; r++) {
                if (gridData[r].every(val => val === 1)) {
                    gridData[r].fill(0);
                    for (let c = 0; c < 8; c++) {
                        cellElements[r * 8 + c].classList.remove('filled');
                    }
                    linesCleared++;
                }
            }
            if (linesCleared > 0) {
                score += linesCleared * 100;
                scoreDisplay.textContent = score;
            }
        }
    </script>
</body>
</html>
