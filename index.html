<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OMNICORE V10</title>
    <style>
        :root { --bg: #000; --card-bg: #0a0a0a; --accent: #fff; --border: #1a1a1a; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, sans-serif; }
        body { background: var(--bg); color: var(--accent); height: 100vh; overflow: hidden; }
        #splash { position: fixed; inset: 0; background: #000; display: flex; justify-content: center; align-items: center; z-index: 9999; transition: 0.5s; }
        #main-app { display: flex; flex-direction: column; height: 100vh; opacity: 0; transition: 0.5s; }
        #main-app.active { opacity: 1; }
        header { padding: 15px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        #chat-window { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 20px; }
        .msg { max-width: 85%; padding: 12px 16px; border-radius: 18px; font-size: 1rem; }
        .user-msg { align-self: flex-end; background: #fff; color: #000; }
        .ai-msg { align-self: flex-start; background: #0a0a0a; border: 1px solid #1a1a1a; color: #ccc; }
        .input-section { padding: 15px; border-top: 1px solid #1a1a1a; }
        .input-container { width: 100%; max-width: 800px; margin: 0 auto; background: #0a0a0a; border: 1px solid #1a1a1a; border-radius: 25px; padding: 5px 15px; display: flex; align-items: center; }
        textarea { flex: 1; background: transparent; border: none; color: #fff; font-size: 16px; padding: 12px 0; outline: none; resize: none; }
        #send-btn { background: #fff; border: none; width: 35px; height: 35px; border-radius: 50%; cursor: pointer; display: flex; justify-content: center; align-items: center; }
    </style>
</head>
<body>
    <div id="splash"><h2>OMNICORE</h2></div>
    <div id="main-app">
        <header><div>OMNICORE V10</div><div style="color:#0f8;">ONLINE</div></header>
        <div id="chat-window"></div>
        <div class="input-section"><div class="input-container">
            <textarea id="prompt" placeholder="Mesaj yaz..." rows="1"></textarea>
            <button id="send-btn">🚀</button>
        </div></div>
    </div>

    <script>
        // Splash geçişi
        window.onload = () => {
            setTimeout(() => {
                document.getElementById('splash').style.opacity = '0';
                document.getElementById('main-app').classList.add('active');
                setTimeout(() => document.getElementById('splash').style.display = 'none', 500);
            }, 1000);
        };

        // KRİTİK ALAN: Buraya sadece tırnak içinde key'ini yapıştır, başka yazı yazma!
        const API_KEY = "gsk_FTrO4B3HdUUG7Q2qyWvTvyWGdyb3FY0g001PoF6HDTu1rQSGdayrdH"; 
        const promptInput = document.getElementById('prompt');
        const chatWindow = document.getElementById('chat-window');

        async function sendMessage() {
            const text = promptInput.value.trim();
            if (!text) return;

            appendMsg(text, 'user-msg');
            promptInput.value = '';

            try {
                const response = await fetch("https://api.x.ai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${API_KEY}`
                    },
                    body: JSON.stringify({
                        messages: [
                            { role: "system", content: "Adın OMNICORE V10. Kurucun 15 yaşındaki dahi yazılımcı Arda'dır." },
                            { role: "user", content: text }
                        ],
                        model: "grok-beta", // Daha güncel ve stabil model
                        stream: false
                    })
                });

                const data = await response.json();
                if (data.choices && data.choices[0]) {
                    appendMsg(data.choices[0].message.content, 'ai-msg');
                } else {
                    appendMsg("Hata: " + (data.error ? data.error.message : "Bilinmeyen hata"), 'ai-msg');
                }
            } catch (e) {
                appendMsg("Bağlantı kesildi. İnternetini kontrol et.", 'ai-msg');
            }
        }

        function appendMsg(text, type) {
            const div = document.createElement('div');
            div.className = `msg ${type}`;
            div.innerText = text;
            chatWindow.appendChild(div);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        document.getElementById('send-btn').onclick = sendMessage;
        promptInput.onkeydown = (e) => { if(e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } };
    </script>
</body>
</html>
