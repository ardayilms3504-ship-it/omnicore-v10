<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OMNICORE V10 | ARCHITECT ARDA</title>
    <style>
        body { margin: 0; background: #000; color: #0f0; font-family: 'Courier New', monospace; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
        #mainUi { display: flex; flex-direction: column; height: 100%; width: 100%; transition: 0.5s; }
        .header { padding: 15px; text-align: center; border-bottom: 1px solid #111; font-size: 20px; font-weight: bold; letter-spacing: 5px; box-shadow: 0 0 10px #0f0; }
        #chat { flex: 1; overflow-y: auto; padding: 20px; padding-bottom: 100px; scroll-behavior: smooth; }
        .msg { margin-bottom: 20px; font-size: 14px; line-height: 1.6; }
        .user { color: #fff; text-align: right; border-bottom: 1px solid #222; padding-bottom: 10px; }
        .ai { color: #0f0; border-left: 3px solid #0f0; padding-left: 15px; }
        .ai img { max-width: 100%; border-radius: 10px; border: 1px solid #0f0; margin-top: 10px; display: block; box-shadow: 0 0 20px rgba(0,255,0,0.4); }

        /* PHONK CALL UI */
        #callUi { display: none; position: fixed; inset: 0; background: #000; z-index: 1000; flex-direction: column; align-items: center; justify-content: center; }
        .call-logo { font-size: 35px; font-weight: bold; color: #0f0; z-index: 10; text-align: center; letter-spacing: 8px; filter: drop-shadow(0 0 15px #0f0); }
        .wave { position: absolute; border-radius: 50%; border: 3px solid #0f0; opacity: 0; pointer-events: none; }
        .wave.active { animation: phonkBounce 1.5s infinite; }
        @keyframes phonkBounce { 0% { transform: scale(0.5); opacity: 0.8; border-width: 8px; } 100% { transform: scale(2.2); opacity: 0; border-width: 1px; } }
        .btn-exit { position: absolute; bottom: 40px; left: 30px; background: rgba(50, 0, 0, 0.8); border: 2px solid #f00; color: #f00; padding: 12px 25px; border-radius: 30px; font-weight: bold; cursor: pointer; text-transform: uppercase; }

        .input-area { position: fixed; bottom: 0; width: 100%; display: flex; padding: 15px; background: #000; border-top: 1px solid #222; box-sizing: border-box; gap: 10px; }
        input { flex: 1; background: #0a0a0a; border: 1px solid #0f0; color: #0f0; padding: 12px; border-radius: 5px; outline: none; font-size: 16px; }
        .btn { background: #0f0; color: #000; border: none; padding: 0 20px; font-weight: bold; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="mainUi">
        <div class="header">OMNICORE V10</div>
        <div id="chat"></div>
        <div class="input-area">
            <button class="btn" style="background:#111; color:#0f0; border:1px solid #0f0;" onclick="startCallMode()">🎤</button>
            <input type="text" id="userInput" placeholder="Görsel iste veya yaz..." onkeypress="if(event.key==='Enter') send()">
            <button class="btn" onclick="send()">GÖNDER</button>
        </div>
    </div>

    <div id="callUi">
        <div class="wave" style="width:250px; height:250px; animation-delay:0s;"></div>
        <div class="wave" style="width:250px; height:250px; animation-delay:0.5s;"></div>
        <div class="wave" style="width:250px; height:250px; animation-delay:1s;"></div>
        <div class="call-logo">OMNICORE<br>V10</div>
        <div id="callStatus" style="margin-top:50px; color:#0f0; opacity:0.6; letter-spacing:3px;">SYSTEM LISTENING...</div>
        <button class="btn-exit" onclick="stopCallMode()">✕ KAPAT</button>
    </div>

    <script>
        // API KEY GİZLEME PROTOKOLÜ
        const _v1 = "gsk_D65T";
        const _v2 = "S2b8C6IILUUan";
        const _v3 = "BCmWGdyb3FYHH5";
        const _v4 = "LlSglkTC29Be3e";
        const _v5 = "mGVsUaq";
        const K = _v1 + _v2 + _v3 + _v4 + _v5;

        let isCalling = false;
        const recog = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        recog.lang = 'tr-TR';

        function speak(text) {
            const synth = window.speechSynthesis;
            const utter = new SpeechSynthesisUtterance(text);
            utter.lang = 'tr-TR';
            utter.rate = 1.1;
            utter.onstart = () => { if(isCalling) toggleWaves(true); };
            utter.onend = () => { toggleWaves(false); if(isCalling) recog.start(); };
            synth.speak(utter);
        }

        function toggleWaves(active) {
            document.querySelectorAll('.wave').forEach(w => active ? w.classList.add('active') : w.classList.remove('active'));
        }

        recog.onresult = (e) => {
            document.getElementById('userInput').value = e.results[0][0].transcript;
            send(true);
        };

        function startCallMode() {
            isCalling = true;
            document.getElementById('mainUi').style.display = 'none';
            document.getElementById('callUi').style.display = 'flex';
            recog.start();
        }

        function stopCallMode() {
            isCalling = false;
            window.speechSynthesis.cancel();
            recog.stop();
            document.getElementById('callUi').style.display = 'none';
            document.getElementById('mainUi').style.display = 'flex';
        }

        async function send(isVoice = false) {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if(!text) return;

            const chat = document.getElementById('chat');
            chat.innerHTML += `<div class="msg user">SİZ > ${text}</div>`;
            input.value = "";

            const aiDiv = document.createElement("div");
            aiDiv.className = "msg ai";
            aiDiv.innerHTML = "OMNICORE > Veri işleniyor...";
            chat.appendChild(aiDiv);

            try {
                const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: { "Authorization": `Bearer ${K}`, "Content-Type": "application/json" },
                    body: JSON.stringify({
                        model: "llama-3.3-70b-versatile",
                        messages: [
                            { role: "system", content: "Sen OMNICORE'sun. Görsel istenirse SADECE şu formatta HTML ver: <img src='https://pollinations.ai/p/INGILIZCE_TANIM?width=1080&height=1080&nologo=true'>. Cevabın sonuna asla başka metin ekleme." },
                            { role: "user", content: text }
                        ],
                        stream: false
                    })
                });

                const data = await res.json();
                const reply = data.choices[0].message.content;
                aiDiv.innerHTML = "OMNICORE > " + reply;
                chat.scrollTop = chat.scrollHeight;

                if(isCalling || isVoice) {
                    const cleanText = reply.replace(/<[^>]*>/g, '').replace('OMNICORE >', '');
                    speak(cleanText || "Görsel protokolü aktif, Architect.");
                }
            } catch (e) { aiDiv.innerHTML = "OMNICORE > SİSTEM HATASI!"; }
        }
    </script>
</body>
</html>
